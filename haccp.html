<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>HACCP Temperature</title>

    <style>
        body { font-family: Arial; background: #fff7c2; padding: 20px; }
        .menu { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        select { padding: 8px; font-size: 16px; }
        .frigo-box { background: white; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .popup {
            background: white; padding: 20px; border-radius: 10px;
            width: 300px; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .popup input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(80px,1fr)); gap: 6px; margin-top:10px; }
        .day-cell { background:#f7f7f7; padding:6px; border-radius:6px; font-size:13px; }
        .day-cell input { width:100%; }
        .frigo-header { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .small { font-size:12px; color:#666; }
    </style>
</head>

<body>

<h1>HACCP – Temperature</h1>

<!-- MENU PRINCIPALE -->
<div class="menu">

    <!-- SEDE -->
    <select id="sede" onchange="caricaFrigo()">
        <option value="Senigallia">Senigallia</option>
        <option value="Marotta">Marotta</option>
        <option value="Furgone1">Furgone 1</option>
        <option value="Furgone2">Furgone 2</option>
    </select>

    <!-- MESE -->
    <select id="mese" onchange="caricaFrigo()"></select>

    <!-- ANNO -->
    <select id="anno" onchange="caricaFrigo()"></select>

    <!-- BOTTONI -->
    <button onclick="abilitaModifica()">Modifica</button>
    <button onclick="salvaDati()">Salva</button>
    <button onclick="mostraPopup()">Aggiungi Frigorifero</button>
    <button onclick="mostraStampa()">Stampa</button>
</div>

<!-- LISTA FRIGORIFERI -->
<h2>Frigoriferi</h2>
<div id="listaFrigo"></div>

<!-- POPUP INSERIMENTO -->
<div id="popup" class="popup" style="display:none;">
    <h3>Nuovo Frigorifero</h3>

    <label>Nome:</label>
    <input type="text" id="nomeFrigo">

    <!-- SCELTA RAPIDA SOTTO IL NOME -->
    <div style="margin-top:10px;">
        <label><input type="radio" name="tipoPopup" value="Frigorifero"> Frigorifero</label><br>
        <label><input type="radio" name="tipoPopup" value="Congelatore"> Congelatore</label>
    </div>

    <button onclick="creaFrigo()">Salva</button>
    <button onclick="chiudiPopup()">Chiudi</button>
</div>

<script>
    // TEMPERATURA CASUALE (una cifra decimale)
    function tempCasuale(tipo) {
        if (tipo === "Congelatore") {
            // -18.0 .. -15.0
            return parseFloat(( -18 + Math.random() * 3 ).toFixed(1));
        } else {
            // 0.0 .. 4.0
            return parseFloat(( 0 + Math.random() * 4 ).toFixed(1));
        }
    }

    function daysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
    }

    // POPOLA MESE E ANNO
    window.onload = function() {
        let meseSel = document.getElementById("mese");
        let annoSel = document.getElementById("anno");

        const mesi = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
        mesi.forEach((m,i)=> meseSel.innerHTML += `<option value="${i}">${m}</option>`);

        let annoCorr = new Date().getFullYear();
        // estendi gli anni dal 2025 fino al 2040
        const startYear = 2025;
        const endYear = 2040;
        for(let a = startYear; a <= endYear; a++){
            annoSel.innerHTML += `<option value="${a}">${a}</option>`;
        }

        // imposta mese e anno correnti
        meseSel.value = new Date().getMonth();
        // se l'anno corrente è oltre endYear, aggiungilo dinamicamente
        if (annoCorr > endYear) {
            annoSel.innerHTML += `<option value="${annoCorr}">${annoCorr}</option>`;
        }
        annoSel.value = new Date().getFullYear();

        caricaFrigo();
    };

    // MOSTRA POPUP
    function mostraPopup() {
        document.getElementById("popup").style.display = "block";
    }

    // CHIUDI POPUP
    function chiudiPopup() {
        document.getElementById("popup").style.display = "none";
    }

    // CREA FRIGO
    function creaFrigo() {
        let nome = document.getElementById("nomeFrigo").value.trim();
        let tipo = document.querySelector("input[name='tipoPopup']:checked");

        if (!nome) {
            alert("Inserisci un nome.");
            return;
        }

        if (!tipo) {
            alert("Seleziona Frigorifero o Congelatore.");
            return;
        }

        let tipoFinale = tipo.value;

        let sede = document.getElementById("sede").value;
        let lista = JSON.parse(localStorage.getItem("haccp_" + sede)) || [];

        // nuovo oggetto con storico temps vuoto
        lista.push({
            nome: nome,
            tipo: tipoFinale,
            temps: {} // keyed by YYYY-MM-DD
        });

        localStorage.setItem("haccp_" + sede, JSON.stringify(lista));

        chiudiPopup();
        caricaFrigo();
    }

    // CARICA FRIGORIFERI
    function caricaFrigo() {
        let sede = document.getElementById("sede").value;
        let lista = JSON.parse(localStorage.getItem("haccp_" + sede)) || [];

        // migrazione: se vecchio formato con 'temp', spostalo in temps con data di oggi
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2,'0');
        const dd = String(today.getDate()).padStart(2,'0');
        const todayKey = `${yyyy}-${mm}-${dd}`;

        lista = lista.map(f => {
            if (f.temp !== undefined && !f.temps) {
                f.temps = {};
                f.temps[todayKey] = f.temp;
                delete f.temp;
            }
            if (!f.temps) f.temps = {};
            return f;
        });

        // Rimuovi date esterne all'intervallo 2025-2040 per tenere i dati puliti
        const MIN_YEAR = 2025;
        const MAX_YEAR = 2040;
        lista.forEach(frigo => {
            if (frigo.temps) {
                Object.keys(frigo.temps).forEach(k => {
                    const yr = parseInt(k.split('-')[0], 10);
                    if (isNaN(yr) || yr < MIN_YEAR || yr > MAX_YEAR) {
                        delete frigo.temps[k];
                    }
                });
            }
        });

        // Determina se dobbiamo auto-generare temperature per il mese/anno selezionato
        let mese = parseInt(document.getElementById("mese").value, 10);
        let anno = parseInt(document.getElementById("anno").value, 10);

        const now = new Date();
        const selectedFirst = new Date(anno, mese, 1);
        let generateUpToDay = 0;

        if (selectedFirst.getFullYear() < now.getFullYear() || (selectedFirst.getFullYear() === now.getFullYear() && selectedFirst.getMonth() < now.getMonth())) {
            // mese/anno selezionato nel passato -> genera tutti i giorni del mese
            generateUpToDay = daysInMonth(anno, mese);
        } else if (selectedFirst.getFullYear() === now.getFullYear() && selectedFirst.getMonth() === now.getMonth()) {
            // mese/anno corrente -> genera fino al giorno odierno
            generateUpToDay = now.getDate();
        } else {
            // futuro -> non generare
            generateUpToDay = 0;
        }

        // se dobbiamo generare, per ogni frigo generiamo solo i giorni mancanti fino a generateUpToDay
        if (generateUpToDay > 0) {
            const ndays = daysInMonth(anno, mese);
            const maxDay = Math.min(generateUpToDay, ndays);

            lista.forEach(frigo => {
                if (!frigo.temps) frigo.temps = {};
                for (let d = 1; d <= maxDay; d++) {
                    const day = String(d).padStart(2,'0');
                    const month = String(mese+1).padStart(2,'0');
                    const key = `${anno}-${month}-${day}`;
                    if (frigo.temps[key] === undefined || frigo.temps[key] === null || frigo.temps[key] === "") {
                        // genera temperatura casuale e salvala
                        frigo.temps[key] = tempCasuale(frigo.tipo);
                    }
                }
            });

            // salva le generazioni automatiche così rimangono persistenti
            localStorage.setItem("haccp_" + sede, JSON.stringify(lista));
        }

        // salva eventuale migrazione / pulizia
        localStorage.setItem("haccp_" + sede, JSON.stringify(lista));

        let box = document.getElementById("listaFrigo");
        box.innerHTML = "";

        const ndaysDisplay = daysInMonth(anno, mese);

        lista.forEach((frigo, index) => {
            // mostra temperatura odierna se presente
            const todayStr = `${String(anno)}-${String(mese+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;

            let html = `
                <div class="frigo-box">
                    <div class="frigo-header">
                        <div>
                            <strong>${frigo.nome}</strong> (${frigo.tipo})
                            <div class="small">Registrazioni per ${document.getElementById('mese').options[document.getElementById('mese').selectedIndex].text} ${anno}</div>
                        </div>
                        <div>
                            <button onclick="eliminaFrigo(${index})">Elimina</button>
                        </div>
                    </div>

                    <!-- GRID GIORNI -->
                    <div class="days-grid" id="grid_${index}">
                    </div>
                </div>
            `;

            box.innerHTML += html;

            // riempi la griglia dei giorni per questo frigo
            let grid = document.getElementById(`grid_${index}`);
            for (let d = 1; d <= ndaysDisplay; d++) {
                const day = String(d).padStart(2,'0');
                const month = String(mese+1).padStart(2,'0');
                const key = `${anno}-${month}-${day}`;
                const val = frigo.temps && frigo.temps[key] !== undefined ? frigo.temps[key] : "";

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `
                    <div class="small">${day}/${month}</div>
                    <input type="number" step="0.1" id="t_${index}_${key}" value="${val}" disabled title="Temperatura per ${key}">
                `;
                grid.appendChild(cell);
            }
        });
    }

    // ELIMINA FRIGO
    function eliminaFrigo(i) {
        let sede = document.getElementById("sede").value;
        let lista = JSON.parse(localStorage.getItem("haccp_" + sede)) || [];

        if (!confirm('Eliminare il frigorifero "' + lista[i].nome + '"?')) return;

        lista.splice(i,1);
        localStorage.setItem("haccp_" + sede, JSON.stringify(lista));
        caricaFrigo();
    }

    // ABILITA MODIFICA
    function abilitaModifica() {
        document.querySelectorAll("input[type='number']").forEach(i => i.disabled = false);
    }

    // SALVA MODIFICHE
    function salvaDati() {
        let sede = document.getElementById("sede").value;
        let lista = JSON.parse(localStorage.getItem("haccp_" + sede)) || [];

        let mese = parseInt(document.getElementById("mese").value, 10);
        let anno = parseInt(document.getElementById("anno").value, 10);
        const ndays = daysInMonth(anno, mese);

        lista.forEach((frigo, index) => {
            if (!frigo.temps) frigo.temps = {};
            for (let d = 1; d <= ndays; d++) {
                const day = String(d).padStart(2,'0');
                const month = String(mese+1).padStart(2,'0');
                const key = `${anno}-${month}-${day}`;
                const input = document.getElementById(`t_${index}_${key}`);
                if (input) {
                    const v = input.value;
                    if (v === '') {
                        // non sovrascrivere se vuoto: cancella la chiave per chiarezza
                        delete frigo.temps[key];
                    } else {
                        frigo.temps[key] = parseFloat(v);
                    }
                }
            }
        });

        localStorage.setItem("haccp_" + sede, JSON.stringify(lista));
        alert("Salvato!");
        caricaFrigo();
    }

    // MOSTRA STAMPA / ANTEPRIMA
    function mostraStampa() {
        let sede = document.getElementById("sede").value;
        let lista = JSON.parse(localStorage.getItem("haccp_" + sede)) || [];
        let mese = parseInt(document.getElementById("mese").value, 10);
        let anno = parseInt(document.getElementById("anno").value, 10);
        const ndays = daysInMonth(anno, mese);
        let monthName = document.getElementById('mese').options[document.getElementById('mese').selectedIndex].text;

        let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resoconto ${monthName} ${anno}</title><style>body{font-family:Arial;padding:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px;text-align:center}.print-button{margin-bottom:20px;padding:10px 20px;font-size:16px;cursor:pointer}@media print{.print-button{display:none}}</style></head><body>`;
        html += `<h2>Resoconto temperature - ${monthName} ${anno} - Sede: ${sede}</h2>`;
        html += `<button class="print-button" onclick="window.print()">Stampa</button>`;
        html += `<table><thead><tr><th>Frigorifero</th><th>Tipo</th>`;
        for (let d=1; d<=ndays; d++){ html += `<th>${d}</th>`}
        html += `</tr></thead><tbody>`;
        lista.forEach(frigo => {
            html += `<tr><td>${frigo.nome}</td><td>${frigo.tipo}</td>`;
            for (let d=1; d<=ndays; d++){
                const day = String(d).padStart(2,'0');
                const month = String(mese+1).padStart(2,'0');
                const key = `${anno}-${month}-${day}`;
                const val = frigo.temps && frigo.temps[key] !== undefined ? frigo.temps[key] : '';
                html += `<td>${val}</td>`;
            }
            html += `</tr>`;
        });
        html += `</tbody></table></body></html>`;

        const w = window.open('', '_blank');
        if (!w) {
            alert('Impossibile aprire la finestra di anteprima. Disabilita il blocco popup nel browser.');
            return;
        }
        w.document.write(html);
        w.document.close();
    }
</script>

</body>
</html>
