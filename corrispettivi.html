<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corrispetttivi - La Casereccia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #222;
}

#top-controls {
    padding: 20px;
    background: white;
    border-bottom: 3px solid #3a0ca3;
}

select {
    padding: 10px;
    margin-right: 10px;
}

button {
    padding: 10px 20px;
    margin-right: 10px;
    border: none;
    background: #3a0ca3;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #f72585;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.table-box {
    flex: 1;
    background: white;
    border: 2px solid #3a0ca3;
    border-radius: 10px;
    padding: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.festivo { background: #f72585; color: white; }
.domenica { background: #7209b7; color: white; }

.tot-prec-box {
    font-weight: bold;
    margin-bottom: 10px;
    background: #fff;
    padding: 10px;
    border: 2px solid #3a0ca3;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="top-controls">
    <h2>Corrispetttivi</h2>

    <label>Mese:</label>
    <select id="mese-select"></select>

    <label>Anno:</label>
    <select id="anno-select"></select>

    <button id="carica-btn">CARICA</button>

    <button id="confronta-periodo-btn">Confronta periodo</button>

    <div style="margin-top:10px;">
        <div class="tot-prec-box">
            Totale mese precedente Marotta:
            <input id="tot-prec-marotta" value="0" disabled style="width:120px;">
        </div>
        <div class="tot-prec-box">
            Totale mese precedente Senigallia:
            <input id="tot-prec-senigallia" value="0" disabled style="width:120px;">
        </div>
        <div class="tot-prec-box">
            Totale mese precedente TOTALE:
            <input id="tot-prec-totale" value="0" disabled style="width:120px;">
        </div>

        <button id="modifica-totali">MODIFICA</button>
        <button id="salva-totali">SALVA</button>
    </div>
</div>

<div class="container">

    <div class="table-box">
        <h3>Marotta</h3>
        <table id="tab-marotta">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Incassi</th>
                    <th>POS</th>
                    <th>Spese</th>
                    <th>Totale cassa</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th colspan="4">Totale mese</th>
                    <th id="tot-marotta">0</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="table-box">
        <h3>Senigallia</h3>
        <table id="tab-senigallia">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Incassi</th>
                    <th>POS</th>
                    <th>Spese</th>
                    <th>Totale cassa</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th colspan="4">Totale mese</th>
                    <th id="tot-senigallia">0</th>
                </tr>
            </tfoot>
        </table>
    </div>

</div>

<script>
// =========================
// SELECT MESE / ANNO
// =========================

const mesi = [
    "Gennaio","Febbraio","Marzo","Aprile",
    "Maggio","Giugno","Luglio","Agosto",
    "Settembre","Ottobre","Novembre","Dicembre"
];

function initSelect() {
    const meseSel = document.getElementById("mese-select");
    const annoSel = document.getElementById("anno-select");

    mesi.forEach((m, i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = m;
        meseSel.appendChild(opt);
    });

    for (let a = 2025; a <= 2035; a++) {
        let opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        annoSel.appendChild(opt);
    }
}
initSelect();

// =========================
// FESTE
// =========================

function isFestivo(m, g) {
    if (m === 0 && g === 1) return true;
    if (m === 3 && g === 25) return true;
    if (m === 4 && g === 1) return true;
    if (m === 7 && g === 15) return true;
    if (m === 11 && g === 25) return true;
    return false;
}

// =========================
// GENERA TABELLE
// =========================

function generaTabelle() {
    const mese = parseInt(document.getElementById("mese-select").value);
    const anno = parseInt(document.getElementById("anno-select").value);

    const giorni = new Date(anno, mese + 1, 0).getDate();

    const marottaBody = document.querySelector("#tab-marotta tbody");
    const senigBody = document.querySelector("#tab-senigallia tbody");

    marottaBody.innerHTML = "";
    senigBody.innerHTML = "";

    for (let g = 1; g <= giorni; g++) {
        const data = new Date(anno, mese, g);
        const day = data.getDay();

        const classe = (day === 0 || isFestivo(mese, g)) ? "festivo" : "";

        marottaBody.appendChild(creaRiga(g, classe, "marotta"));
        senigBody.appendChild(creaRiga(g, classe, "senigallia"));
    }

    caricaMese("marotta");
    caricaMese("senigallia");
    aggiornaTotalePrecedente();
}

// =========================
// CREA RIGA
// =========================

function creaRiga(g, classe, sede) {
    const tr = document.createElement("tr");

    const tdG = document.createElement("td");
    tdG.textContent = g;
    if (classe) tdG.classList.add(classe);

    const tdInc = creaInput();
    const tdPos = creaInput();
    const tdSpese = creaInput();
    const tdTot = document.createElement("td");
    tdTot.textContent = "0";

    tdInc.oninput = () => aggiornaTotaleSede(sede);
    tdPos.oninput = () => aggiornaTotaleSede(sede);
    tdSpese.oninput = () => aggiornaTotaleSede(sede);

    tr.appendChild(tdG);
    tr.appendChild(tdInc);
    tr.appendChild(tdPos);
    tr.appendChild(tdSpese);
    tr.appendChild(tdTot);

    return tr;
}

function creaInput() {
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.type = "number";
    inp.value = "";
    inp.style.width = "80px";
    td.appendChild(inp);
    return td;
}

// =========================
// SALVATAGGIO AUTOMATICO
// =========================

function salvaMese(sede) {
    const mese = document.getElementById("mese-select").value;
    const anno = document.getElementById("anno-select").value;

    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    let dati = [];

    righe.forEach(r => {
        const giorno = r.children[0].textContent;
        const inc = r.children[1].children[0].value || "0";
        const pos = r.children[2].children[0].value || "0";
        const spese = r.children[3].children[0].value || "0";
        const tot = r.children[4].textContent || "0";

        dati.push({ giorno, inc, pos, spese, tot });
    });

    localStorage.setItem(`corrisp-${sede}-${anno}-${mese}`, JSON.stringify(dati));
}

function caricaMese(sede) {
    const mese = document.getElementById("mese-select").value;
    const anno = document.getElementById("anno-select").value;

    const dati = JSON.parse(localStorage.getItem(`corrisp-${sede}-${anno}-${mese}`));

    if (!dati) return;

    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    dati.forEach((d, i) => {
        righe[i].children[1].children[0].value = d.inc;
        righe[i].children[2].children[0].value = d.pos;
        righe[i].children[3].children[0].value = d.spese;
        righe[i].children[4].textContent = d.tot;
    });

    aggiornaTotaleSede(sede);
}

// =========================
// CALCOLI TOTALI
// =========================

function aggiornaTotaleSede(sede) {
    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    let totale = 0;

    righe.forEach(r => {
        const inc = parseFloat(r.children[1].children[0].value) || 0;
        const pos = parseFloat(r.children[2].children[0].value) || 0;
        const spese = parseFloat(r.children[3].children[0].value) || 0;

        const tot = inc - pos - spese;
        r.children[4].textContent = tot.toFixed(2);

        totale += tot;
    });

    document.getElementById(`tot-${sede}`).textContent = totale.toFixed(2);

    salvaMese(sede);

    aggiornaTotalePrecedente();
}

// =========================
// TOTALE MESE PRECEDENTE CUMULATIVO
// =========================

function aggiornaTotalePrecedente() {
    const mese = parseInt(document.getElementById("mese-select").value);
    const anno = parseInt(document.getElementById("anno-select").value);

    let totPrecMarotta = 0;
    let totPrecSenigallia = 0;

    for (let m = 0; m < mese; m++) {
        const datiM = JSON.parse(localStorage.getItem(`corrisp-marotta-${anno}-${m}`));
        const datiS = JSON.parse(localStorage.getItem(`corrisp-senigallia-${anno}-${m}`));

        if (datiM) datiM.forEach(d => totPrecMarotta += parseFloat(d.tot));
        if (datiS) datiS.forEach(d => totPrecSenigallia += parseFloat(d.tot));
    }

    document.getElementById("tot-prec-marotta").value = totPrecMarotta.toFixed(2);
    document.getElementById("tot-prec-senigallia").value = totPrecSenigallia.toFixed(2);
    document.getElementById("tot-prec-totale").value = (totPrecMarotta + totPrecSenigallia).toFixed(2);
}

// =========================
// MODIFICA / SALVA TOTALI
// =========================

document.getElementById("modifica-totali").addEventListener("click", () => {
    document.getElementById("tot-prec-marotta").disabled = false;
    document.getElementById("tot-prec-senigallia").disabled = false;
});

document.getElementById("salva-totali").addEventListener("click", () => {
    document.getElementById("tot-prec-marotta").disabled = true;
    document.getElementById("tot-prec-senigallia").disabled = true;

    alert("Totali mese precedente salvati manualmente.");
});

// =========================
// CONFRONTO PERIODO
// =========================

document.getElementById("confronta-periodo-btn").addEventListener("click", () => {
    window.location.href = "confronto.html";
});

// =========================
// CARICA
// =========================

document.getElementById("carica-btn").addEventListener("click", generaTabelle);

</script>

</body>
</html>
