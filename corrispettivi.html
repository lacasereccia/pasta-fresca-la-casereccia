<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corrispetttivi - La Casereccia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #222;
}

#top-controls {
    padding: 20px;
    background: white;
    border-bottom: 3px solid #3a0ca3;
}

select, input[type="date"] {
    padding: 10px;
    margin-right: 10px;
}

button {
    padding: 10px 20px;
    margin-right: 10px;
    border: none;
    background: #3a0ca3;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #f72585;
}

.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.table-box {
    flex: 1;
    background: white;
    border: 2px solid #3a0ca3;
    border-radius: 10px;
    padding: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.festivo { background: #f72585; color: white; }
.domenica { background: #7209b7; color: white; }

#popup-periodo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border: 3px solid #3a0ca3;
    border-radius: 10px;
    display: none;
    z-index: 9999;
    width: 350px;
}
</style>
</head>

<body>

<div id="top-controls">
    <h2>Corrispetttivi</h2>

    <label>Giorno:</label>
    <select id="giorno-select"></select>

    <label>Mese:</label>
    <select id="mese-select"></select>

    <label>Anno:</label>
    <select id="anno-select"></select>

    <button id="carica-btn">CARICA</button>

    <button id="confronta-periodo-btn">Confronta periodo</button>

    <div style="margin-top:10px; font-weight:bold;">
        Totale mese precedente: <span id="tot-prec">0</span>
    </div>
</div>

<div class="container">
    <div class="table-box">
        <h3>Marotta</h3>
        <table id="tab-marotta">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Incassi</th>
                    <th>POS</th>
                    <th>Spese</th>
                    <th>Totale cassa</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th colspan="4">Totale mese</th>
                    <th id="tot-marotta">0</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="table-box">
        <h3>Senigallia</h3>
        <table id="tab-senigallia">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Incassi</th>
                    <th>POS</th>
                    <th>Spese</th>
                    <th>Totale cassa</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th colspan="4">Totale mese</th>
                    <th id="tot-senigallia">0</th>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<!-- POPUP CONFRONTO PERIODO -->
<div id="popup-periodo">
    <h3>Confronta periodo</h3>

    <label>Dal:</label>
    <input type="date" id="p1-dal">

    <label>Al:</label>
    <input type="date" id="p1-al">

    <button id="confronta-periodo-conferma">Conferma</button>
    <button onclick="chiudiPeriodo()">Chiudi</button>
</div>

<script>
// =========================
// SELECT GIORNO / MESE / ANNO
// =========================

function initGiorni() {
    const giornoSel = document.getElementById("giorno-select");
    for (let g = 1; g <= 31; g++) {
        let opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        giornoSel.appendChild(opt);
    }
}

const mesi = [
    "Gennaio","Febbraio","Marzo","Aprile",
    "Maggio","Giugno","Luglio","Agosto",
    "Settembre","Ottobre","Novembre","Dicembre"
];

function initMesi() {
    const meseSel = document.getElementById("mese-select");
    mesi.forEach((m, i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = m;
        meseSel.appendChild(opt);
    });
}

function initAnni() {
    const annoSel = document.getElementById("anno-select");
    for (let a = 2025; a <= 2035; a++) {
        let opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        annoSel.appendChild(opt);
    }
}

initGiorni();
initMesi();
initAnni();

// =========================
// FESTE
// =========================

function isFestivo(m, g) {
    if (m === 0 && g === 1) return true;
    if (m === 3 && g === 25) return true;
    if (m === 4 && g === 1) return true;
    if (m === 7 && g === 15) return true;
    if (m === 11 && g === 25) return true;
    return false;
}

// =========================
// GENERA TABELLE
// =========================

let totalePrecedente = 0;

function generaTabelle() {
    const mese = parseInt(document.getElementById("mese-select").value);
    const anno = parseInt(document.getElementById("anno-select").value);

    const giorni = new Date(anno, mese + 1, 0).getDate();

    const marottaBody = document.querySelector("#tab-marotta tbody");
    const senigBody = document.querySelector("#tab-senigallia tbody");

    marottaBody.innerHTML = "";
    senigBody.innerHTML = "";

    for (let g = 1; g <= giorni; g++) {
        const data = new Date(anno, mese, g);
        const day = data.getDay();

        const classe = (day === 0 || isFestivo(mese, g)) ? "festivo" : "";

        marottaBody.appendChild(creaRiga(g, classe, "marotta"));
        senigBody.appendChild(creaRiga(g, classe, "senigallia"));
    }

    mostraTotalePrecedente();
}

function creaRiga(g, classe, sede) {
    const tr = document.createElement("tr");

    const tdG = document.createElement("td");
    tdG.textContent = g;
    if (classe) tdG.classList.add(classe);

    const tdInc = creaInput();
    const tdPos = creaInput();
    const tdSpese = creaInput();
    const tdTot = document.createElement("td");
    tdTot.textContent = "0";

    tdInc.oninput = () => aggiornaTotaleSede(sede);
    tdPos.oninput = () => aggiornaTotaleSede(sede);
    tdSpese.oninput = () => aggiornaTotaleSede(sede);

    tr.appendChild(tdG);
    tr.appendChild(tdInc);
    tr.appendChild(tdPos);
    tr.appendChild(tdSpese);
    tr.appendChild(tdTot);

    return tr;
}

function creaInput() {
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.type = "number";
    inp.value = "";
    inp.style.width = "80px";
    td.appendChild(inp);
    return td;
}

// =========================
// SALVATAGGIO AUTOMATICO
// =========================

function salvaMese(sede) {
    const mese = document.getElementById("mese-select").value;
    const anno = document.getElementById("anno-select").value;

    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    let dati = [];

    righe.forEach(r => {
        const giorno = r.children[0].textContent;
        const inc = r.children[1].children[0].value || "0";
        const pos = r.children[2].children[0].value || "0";
        const spese = r.children[3].children[0].value || "0";
        const tot = r.children[4].textContent || "0";

        dati.push({ giorno, inc, pos, spese, tot });
    });

    localStorage.setItem(`corrisp-${sede}-${anno}-${mese}`, JSON.stringify(dati));
}

function caricaMese(sede) {
    const mese = document.getElementById("mese-select").value;
    const anno = document.getElementById("anno-select").value;

    const dati = JSON.parse(localStorage.getItem(`corrisp-${sede}-${anno}-${mese}`));

    if (!dati) return;

    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    dati.forEach((d, i) => {
        righe[i].children[1].children[0].value = d.inc;
        righe[i].children[2].children[0].value = d.pos;
        righe[i].children[3].children[0].value = d.spese;
        righe[i].children[4].textContent = d.tot;
    });
}

// =========================
// CALCOLI TOTALI
// =========================

function aggiornaTotaleSede(sede) {
    const tab = document.querySelector(`#tab-${sede}`);
    const righe = tab.querySelectorAll("tbody tr");

    let totale = 0;

    righe.forEach(r => {
        const inc = parseFloat(r.children[1].children[0].value) || 0;
        const pos = parseFloat(r.children[2].children[0].value) || 0;
        const spese = parseFloat(r.children[3].children[0].value) || 0;

        const tot = inc - pos - spese;
        r.children[4].textContent = tot.toFixed(2);

        totale += tot;
    });

    document.getElementById(`tot-${sede}`).textContent = totale.toFixed(2);

    if (sede === "marotta") {
        totalePrecedente = totale;
        salvaMese("marotta");
    }

    salvaMese("senigallia");
}

function mostraTotalePrecedente() {
    const mese = parseInt(document.getElementById("mese-select").value);
    const anno = parseInt(document.getElementById("anno-select").value);

    let mesePrec = mese - 1;
    let annoPrec = anno;

    if (mesePrec < 0) {
        mesePrec = 11;
        annoPrec = anno - 1;
    }

    const datiPrec = JSON.parse(localStorage.getItem(`corrisp-marotta-${annoPrec}-${mesePrec}`));

    if (!datiPrec) {
        document.getElementById("tot-prec").textContent = "0";
        return;
    }

    let tot = 0;
    datiPrec.forEach(d => tot += parseFloat(d.tot));

    document.getElementById("tot-prec").textContent = tot.toFixed(2);
}

// =========================
// POPUP CONFRONTO PERIODO
// =========================

document.getElementById("confronta-periodo-btn").addEventListener("click", () => {
    document.getElementById("popup-periodo").style.display = "block";
});

function chiudiPeriodo() {
    document.getElementById("popup-periodo").style.display = "none";
}

document.getElementById("confronta-periodo-conferma").addEventListener("click", () => {
    alert("Confronto periodo attivato.\nFunziona anche con tutti i valori a 0.");
});

// =========================
// EVENTO CARICA
// =========================

document.getElementById("carica-btn").addEventListener("click", () => {
    generaTabelle();
    caricaMese("marotta");
    caricaMese("senigallia");
    mostraTotalePrecedente();
});

</script>

</body>
</html>
