<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ferie - La Casereccia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #222;
}

#top-controls {
    padding: 20px;
    background: white;
    border-bottom: 3px solid #3a0ca3;
}

select, input {
    padding: 10px;
    margin-right: 10px;
}

button {
    padding: 10px 20px;
    margin-right: 10px;
    border: none;
    background: #3a0ca3;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #f72585;
}

#dipendenti-box {
    padding: 20px;
    background: white;
    border-bottom: 3px solid #3a0ca3;
}

#dipendenti-box table {
    width: 100%;
    border-collapse: collapse;
}

#dipendenti-box th, #dipendenti-box td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

#calendar-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    padding: 20px;
}

.month {
    background: white;
    border: 2px solid #3a0ca3;
    border-radius: 10px;
    padding: 10px;
}

.month table {
    width: 100%;
    border-collapse: collapse;
}

.month th, .month td {
    padding: 6px;
    text-align: center;
    border: 1px solid #ddd;
    cursor: pointer;
}

.festivo { background: #f72585; color: white; }
.domenica { background: #7209b7; color: white; }
.bloccato { background: #b5179e; color: white; }
.ferie { background: #4cc9f0; color: black; }

#popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border: 3px solid #3a0ca3;
    border-radius: 10px;
    display: none;
    z-index: 9999;
    width: 350px;
}
</style>
</head>

<body>

<div id="top-controls">
    <h2>Gestione Ferie</h2>

    <label>Anno:</label>
    <select id="anno-select"></select>

    <button id="modifica-btn">MODIFICA</button>
    <button id="salva-btn">SALVA</button>
    <button id="aggiorna-btn">AGGIORNA</button>
</div>

<div id="dipendenti-box">
    <h3>Dipendenti</h3>

    <table id="dipendenti-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ore iniziali</th>
                <th>Ore residue</th>
                <th>Elimina</th>
            </tr>
        </thead>
        <tbody id="dipendenti-body"></tbody>
    </table>

    <button id="add-dip-btn">AGGIUNGI DIPENDENTE</button>
</div>

<div id="calendar-grid"></div>

<!-- POPUP FERIE -->
<div id="popup">
    <h3>Assegna ferie</h3>

    <label>Dipendente:</label>
    <select id="popup-dipendente"></select>

    <label>Numero giorni consecutivi:</label>
    <input type="number" id="popup-giorni" min="1">

    <button id="popup-conferma">Conferma</button>
    <button id="popup-chiudi">Chiudi</button>
</div>

<script>
// =========================
// ANNI
// =========================

function initAnni() {
    const sel = document.getElementById("anno-select");
    for (let a = 2025; a <= 2035; a++) {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        sel.appendChild(opt);
    }
}
initAnni();

let annoCorrente = 2025;

// =========================
// DIPENDENTI
// =========================

let dipendenti = JSON.parse(localStorage.getItem("dipendenti")) || [
    { nome: "Marco", oreIniziali: 160, oreResidue: 160 },
    { nome: "Davide", oreIniziali: 160, oreResidue: 160 }
];

function salvaDipendenti() {
    localStorage.setItem("dipendenti", JSON.stringify(dipendenti));
}

function initDipendenti() {
    const body = document.getElementById("dipendenti-body");
    body.innerHTML = "";

    dipendenti.forEach((d, i) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td><input value="${d.nome}" data-i="${i}" class="nome"></td>
            <td><input type="number" value="${d.oreIniziali}" data-i="${i}" class="oreI"></td>
            <td><input type="number" value="${d.oreResidue}" data-i="${i}" class="oreR"></td>
            <td><button onclick="eliminaDip(${i})">X</button></td>
        `;

        body.appendChild(tr);
    });

    const sel = document.getElementById("popup-dipendente");
    sel.innerHTML = "";
    dipendenti.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.nome;
        opt.textContent = d.nome;
        sel.appendChild(opt);
    });
}

function eliminaDip(i) {
    dipendenti.splice(i, 1);
    salvaDipendenti();
    initDipendenti();
}

document.getElementById("add-dip-btn").addEventListener("click", () => {
    dipendenti.push({ nome: "Nuovo", oreIniziali: 0, oreResidue: 0 });
    salvaDipendenti();
    initDipendenti();
});

// =========================
// PASQUA AUTOMATICA
// =========================

function getPasqua(year) {
    let a = year % 19;
    let b = Math.floor(year / 100);
    let c = year % 100;
    let d = Math.floor(b / 4);
    let e = b % 4;
    let f = Math.floor((b + 8) / 25);
    let g = Math.floor((b - f + 1) / 3);
    let h = (19 * a + b - d - g + 15) % 30;
    let i = Math.floor(c / 4);
    let k = c % 4;
    let l = (32 + 2 * e + 2 * i - h - k) % 7;
    let m = Math.floor((a + 11 * h + 22 * l) / 451);
    let mese = Math.floor((h + l - 7 * m + 114) / 31);
    let giorno = ((h + l - 7 * m + 114) % 31) + 1;
    return { mese: mese - 1, giorno };
}

// =========================
// CALENDARIO
// =========================

let ferie = JSON.parse(localStorage.getItem("ferie")) || {};

function salvaFerie() {
    localStorage.setItem("ferie", JSON.stringify(ferie));
}

function generaCalendario(anno) {
    annoCorrente = anno;

    const grid = document.getElementById("calendar-grid");
    grid.innerHTML = "";

    const pasqua = getPasqua(anno);
    const pasquaDate = new Date(anno, pasqua.mese, pasqua.giorno);

    for (let m = 0; m < 12; m++) {
        const div = document.createElement("div");
        div.className = "month";

        div.innerHTML = `<h3>${["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"][m]} ${anno}</h3>`;

        const table = document.createElement("table");

        const thead = document.createElement("thead");
        thead.innerHTML = `
            <tr>
                <th>Lu</th><th>Ma</th><th>Me</th><th>Gi</th><th>Ve</th><th>Sa</th><th>Do</th>
            </tr>`;
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        const primo = new Date(anno, m, 1).getDay();
        const offset = primo === 0 ? 6 : primo - 1;
        const giorni = new Date(anno, m + 1, 0).getDate();

        let r = document.createElement("tr");
        for (let i = 0; i < offset; i++) r.appendChild(document.createElement("td"));

        for (let g = 1; g <= giorni; g++) {
            if (r.children.length === 7) {
                tbody.appendChild(r);
                r = document.createElement("tr");
            }

            const td = document.createElement("td");
            td.textContent = g;
            td.dataset.mese = m;
            td.dataset.giorno = g;

            const d = new Date(anno, m, g);

            if (d.getDay() === 0) td.classList.add("domenica");

            if (m === pasqua.mese && g === pasqua.giorno) td.classList.add("festivo");
            if (d >= pasquaDate && d <= new Date(pasquaDate.getTime() + 14 * 86400000)) {
                td.classList.add("bloccato");
            }

            td.addEventListener("click", () => onDayClick(td));

            r.appendChild(td);
        }

        while (r.children.length < 7) r.appendChild(document.createElement("td"));
        tbody.appendChild(r);

        table.appendChild(tbody);
        div.appendChild(table);
        grid.appendChild(div);
    }

    ricoloraFerie();
}

// =========================
// CLICK GIORNO
// =========================

let giornoSelezionato = null;

function onDayClick(td) {
    giornoSelezionato = {
        mese: parseInt(td.dataset.mese),
        giorno: parseInt(td.dataset.giorno)
    };
    document.getElementById("popup").style.display = "block";
}

// =========================
// ASSEGNA FERIE
// =========================

document.getElementById("popup-conferma").addEventListener("click", () => {
    const nome = document.getElementById("popup-dipendente").value;
    const giorni = parseInt(document.getElementById("popup-giorni").value);

    if (!ferie[annoCorrente]) ferie[annoCorrente] = {};
    if (!ferie[annoCorrente][giornoSelezionato.mese]) ferie[annoCorrente][giornoSelezionato.mese] = {};

    for (let i = 0; i < giorni; i++) {
        const d = new Date(annoCorrente, giornoSelezionato.mese, giornoSelezionato.giorno + i);
        const m = d.getMonth();
        const g = d.getDate();

        if (!ferie[annoCorrente][m]) ferie[annoCorrente][m] = {};
        ferie[annoCorrente][m][g] = nome;
    }

    salvaFerie();
    ricoloraFerie();
    document.getElementById("popup").style.display = "none";
});

document.getElementById("popup-chiudi").addEventListener("click", () => {
    document.getElementById("popup").style.display = "none";
});

// =========================
// RICOLORA
// =========================

function ricoloraFerie() {
    const celle = document.querySelectorAll(".month td");

    celle.forEach(td => {
        const m = parseInt(td.dataset.mese);
        const g = parseInt(td.dataset.giorno);

        if (ferie[annoCorrente] &&
            ferie[annoCorrente][m] &&
            ferie[annoCorrente][m][g]) {
            td.classList.add("ferie");
        }
    });
}

// =========================
// MODIFICA / SALVA
// =========================

document.getElementById("modifica-btn").addEventListener("click", () => {
    document.querySelectorAll("#dipendenti-box input").forEach(i => i.disabled = false);
});

document.getElementById("salva-btn").addEventListener("click", () => {
    document.querySelectorAll("#dipendenti-box input").forEach(i => i.disabled = true);

    document.querySelectorAll(".nome").forEach(i => {
        dipendenti[i.dataset.i].nome = i.value;
    });
    document.querySelectorAll(".oreI").forEach(i => {
        dipendenti[i.dataset.i].oreIniziali = parseInt(i.value);
    });
    document.querySelectorAll(".oreR").forEach(i => {
        dipendenti[i.dataset.i].oreResidue = parseInt(i.value);
    });

    salvaDipendenti();
    initDipendenti();
});

// =========================
// AGGIORNA (ROTTAZIONE)
// =========================

document.getElementById("aggiorna-btn").addEventListener("click", () => {
    const primo = dipendenti.shift();
    dipendenti.push(primo);
    salvaDipendenti();
    initDipendenti();
});

// =========================
// CAMBIO ANNO
// =========================

document.getElementById("anno-select").addEventListener("change", () => {
    generaCalendario(parseInt(document.getElementById("anno-select").value));
});

// =========================
// AVVIO
// =========================

initDipendenti();
generaCalendario(annoCorrente);

</script>

</body>
</html>
