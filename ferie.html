<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ferie - La Casereccia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- PALETTE MODERNA -->
<style>
:root {
    --ferie: #4cc9f0;        /* azzurro moderno */
    --festivo: #f72585;      /* rosa acceso */
    --bloccato: #b5179e;     /* viola scuro */
    --domenica: #7209b7;     /* viola */
    --bordo: #3a0ca3;        /* blu scuro */
    --sfondo: #f8f9fa;       /* grigio chiaro */
    --popup: #ffffff;
    --testo: #222;
}

/* RESET */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--sfondo);
    color: var(--testo);
}

/* HEADER DIPENDENTI */
#dipendenti-container {
    padding: 20px;
    background: white;
    border-bottom: 3px solid var(--bordo);
}

#dipendenti-container h2 {
    margin: 0 0 10px 0;
}

#dipendenti-table {
    width: 100%;
    border-collapse: collapse;
}

#dipendenti-table th, #dipendenti-table td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

/* BOTTONI */
button {
    padding: 10px 20px;
    margin-right: 10px;
    border: none;
    background: var(--bordo);
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: var(--festivo);
}

/* GRIGLIA CALENDARIO 2×6 */
#calendar-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    padding: 20px;
}

.month {
    background: white;
    border: 2px solid var(--bordo);
    border-radius: 10px;
    padding: 10px;
}

.month h3 {
    text-align: center;
    margin-top: 0;
}

/* TABELLA GIORNI */
.month table {
    width: 100%;
    border-collapse: collapse;
}

.month th, .month td {
    padding: 6px;
    text-align: center;
    border: 1px solid #ddd;
    cursor: pointer;
}

/* COLORI */
.festivo { background: var(--festivo); color: white; }
.domenica { background: var(--domenica); color: white; }
.bloccato { background: var(--bloccato); color: white; }
.ferie { background: var(--ferie); color: black; }

/* POPUP */
#popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--popup);
    padding: 20px;
    border: 3px solid var(--bordo);
    border-radius: 10px;
    display: none;
    z-index: 9999;
}

#popup input, #popup select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

#popup button {
    width: 100%;
    margin-top: 15px;
}
</style>
</head>

<body>

<div id="dipendenti-container">
    <h2>Dipendenti</h2>
    <table id="dipendenti-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ore iniziali</th>
                <th>Ore residue</th>
            </tr>
        </thead>
        <tbody id="dipendenti-body">
            <!-- Riempito via JS -->
        </tbody>
    </table>

    <button id="modifica-btn">MODIFICA</button>
    <button id="salva-btn">SALVA</button>
    <button id="aggiorna-btn">AGGIORNA</button>
</div>

<div id="calendar-grid">
    <!-- I 12 mesi vengono generati via JavaScript -->
</div>

<!-- POPUP -->
<div id="popup">
    <h3>Assegna ferie</h3>
    <label>Dipendente:</label>
    <select id="popup-dipendente"></select>

    <label>Numero giorni consecutivi:</label>
    <input type="number" id="popup-giorni" min="1">

    <button id="popup-conferma">Conferma</button>
    <button id="popup-chiudi">Chiudi</button>
</div>
<!-- BLOCCO 2 – JAVASCRIPT COMPLETO (da mettere subito dopo il BLOCCO 1, prima di </body>) -->
<script>
// =========================
// DATI DI BASE
// =========================

const dipendenti = [
    { nome: "Marco", oreIniziali: 160, oreResidue: 160 },
    { nome: "Davide", oreIniziali: 160, oreResidue: 160 },
    { nome: "Paolo", oreIniziali: 160, oreResidue: 160 },
    { nome: "Sara", oreIniziali: 160, oreResidue: 160 },
    { nome: "Luca", oreIniziali: 160, oreResidue: 160 }
];

let modalitaModifica = false;
let annoCorrente = 2026; // il primo anno lo gestisci tu manualmente

// struttura: ferie[anno][mese][giorno] = nomeDipendente
const ferie = {};

const mesi = [
    "Gennaio","Febbraio","Marzo","Aprile",
    "Maggio","Giugno","Luglio","Agosto",
    "Settembre","Ottobre","Novembre","Dicembre"
];

// =========================
// INIZIALIZZAZIONE DIPENDENTI
// =========================

function initDipendenti() {
    const tbody = document.getElementById("dipendenti-body");
    tbody.innerHTML = "";
    dipendenti.forEach(d => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${d.nome}</td>
            <td>${d.oreIniziali}</td>
            <td>${d.oreResidue}</td>
        `;
        tbody.appendChild(tr);
    });

    const select = document.getElementById("popup-dipendente");
    select.innerHTML = "";
    dipendenti.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.nome;
        opt.textContent = d.nome;
        select.appendChild(opt);
    });
}

// =========================
// FESTE E PERIODI BLOCCATI
// =========================

function isFestivo(meseIndex, giorno) {
    // esempio base: 1 gennaio, 25 aprile, 1 maggio, 15 agosto, 25 dicembre
    const m = meseIndex;
    const g = giorno;
    if (m === 0 && g === 1) return true;   // 1 gennaio
    if (m === 3 && g === 25) return true;  // 25 aprile
    if (m === 4 && g === 1) return true;   // 1 maggio
    if (m === 7 && g === 15) return true;  // 15 agosto
    if (m === 11 && g === 25) return true; // 25 dicembre
    return false;
}

function isPeriodoBloccato(meseIndex, giorno) {
    const m = meseIndex;
    const g = giorno;

    // APRILE 1–15 bloccato
    if (m === 3 && g >= 1 && g <= 15) return true;

    // AGOSTO e SETTEMBRE bloccati
    if (m === 7 || m === 8) return true;

    // DICEMBRE bloccato
    if (m === 11) return true;

    return false;
}

// =========================
// GENERAZIONE CALENDARIO
// =========================

function generaCalendario(anno) {
    annoCorrente = anno;
    const grid = document.getElementById("calendar-grid");
    grid.innerHTML = "";

    for (let m = 0; m < 12; m++) {
        const monthDiv = document.createElement("div");
        monthDiv.className = "month";

        const h3 = document.createElement("h3");
        h3.textContent = `${mesi[m]} ${anno}`;
        monthDiv.appendChild(h3);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const trHead = document.createElement("tr");
        ["Lu","Ma","Me","Gi","Ve","Sa","Do"].forEach(g => {
            const th = document.createElement("th");
            th.textContent = g;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        const primoGiorno = new Date(anno, m, 1).getDay(); // 0=Dom,1=Lun...
        const giorniNelMese = new Date(anno, m + 1, 0).getDate();

        let giornoCorrente = 1;
        let riga = document.createElement("tr");

        // offset iniziale
        let offset = primoGiorno === 0 ? 6 : primoGiorno - 1;
        for (let i = 0; i < offset; i++) {
            const td = document.createElement("td");
            td.textContent = "";
            riga.appendChild(td);
        }

        while (giornoCorrente <= giorniNelMese) {
            if (riga.children.length === 7) {
                tbody.appendChild(riga);
                riga = document.createElement("tr");
            }

            const td = document.createElement("td");
            td.textContent = giornoCorrente;
            td.dataset.mese = m;
            td.dataset.giorno = giornoCorrente;

            const data = new Date(anno, m, giornoCorrente);
            const day = data.getDay(); // 0=Dom

            if (day === 0) td.classList.add("domenica");
            if (isFestivo(m, giornoCorrente)) td.classList.add("festivo");
            if (isPeriodoBloccato(m, giornoCorrente)) td.classList.add("bloccato");

            td.addEventListener("click", () => onDayClick(td));

            riga.appendChild(td);
            giornoCorrente++;
        }

        if (riga.children.length > 0) {
            while (riga.children.length < 7) {
                const td = document.createElement("td");
                td.textContent = "";
                riga.appendChild(td);
            }
            tbody.appendChild(riga);
        }

        table.appendChild(tbody);
        monthDiv.appendChild(table);
        grid.appendChild(monthDiv);
    }

    // ricolora eventuali ferie già presenti
    ricoloraFerie();
}

// =========================
// CLICK SUL GIORNO
// =========================

let giornoSelezionato = null;

function onDayClick(td) {
    const meseIndex = parseInt(td.dataset.mese);
    const giorno = parseInt(td.dataset.giorno);

    if (!modalitaModifica) {
        // modalità normale: rispetto regole
        if (isFestivo(meseIndex, giorno) || isPeriodoBloccato(meseIndex, giorno)) {
            alert("Periodo bloccato: non è possibile inserire ferie in modalità normale.");
            return;
        }
    }

    giornoSelezionato = { meseIndex, giorno };
    apriPopup();
}

// =========================
// POPUP
// =========================

function apriPopup() {
    document.getElementById("popup-giorni").value = "";
    document.getElementById("popup").style.display = "block";
}

function chiudiPopup() {
    document.getElementById("popup").style.display = "none";
}

// =========================
// ASSEGNAZIONE FERIE
// =========================

function assegnaFerie() {
    if (!giornoSelezionato) return;

    const nomeDip = document.getElementById("popup-dipendente").value;
    const numGiorni = parseInt(document.getElementById("popup-giorni").value);

    if (!nomeDip || !numGiorni || numGiorni < 1) {
        alert("Seleziona un dipendente e un numero di giorni valido.");
        return;
    }

    const anno = annoCorrente;
    const mStart = giornoSelezionato.meseIndex;
    const gStart = giornoSelezionato.giorno;

    if (!ferie[anno]) ferie[anno] = {};
    if (!ferie[anno][mStart]) ferie[anno][mStart] = {};

    for (let i = 0; i < numGiorni; i++) {
        const data = new Date(anno, mStart, gStart + i);
        const m = data.getMonth();
        const g = data.getDate();

        if (!modalitaModifica) {
            if (isFestivo(m, g) || isPeriodoBloccato(m, g)) {
                // in modalità normale, non assegno su giorni bloccati
                continue;
            }
        }

        if (!ferie[anno][m]) ferie[anno][m] = {};
        ferie[anno][m][g] = nomeDip;
    }

    // scala ore (esempio: 8 ore al giorno)
    const dip = dipendenti.find(d => d.nome === nomeDip);
    if (dip) {
        dip.oreResidue -= numGiorni * 8;
        if (dip.oreResidue < 0) dip.oreResidue = 0;
    }

    initDipendenti();
    ricoloraFerie();
    chiudiPopup();
}

// =========================
// RICOLORA FERIE
// =========================

function ricoloraFerie() {
    const anno = annoCorrente;
    if (!ferie[anno]) return;

    const celle = document.querySelectorAll(".month td");
    celle.forEach(td => {
        const m = parseInt(td.dataset.mese);
        const g = parseInt(td.dataset.giorno);
        if (isNaN(m) || isNaN(g)) return;

        if (ferie[anno][m] && ferie[anno][m][g]) {
            td.classList.add("ferie");
        }
    });
}

// =========================
// MODALITÀ MODIFICA / SALVA
// =========================

document.getElementById("modifica-btn").addEventListener("click", () => {
    modalitaModifica = true;
    alert("Modalità MODIFICA attiva: puoi bypassare tutte le regole.");
});

document.getElementById("salva-btn").addEventListener("click", () => {
    modalitaModifica = false;
    alert("Modifiche salvate. Modalità normale ripristinata.");
});

// =========================
// TASTO AGGIORNA (ROTTAZIONE ANNUALE)
// =========================

document.getElementById("aggiorna-btn").addEventListener("click", () => {
    if (annoCorrente === 2026) {
        alert("Per il 2026 le ferie sono gestite manualmente. Cambia anno per usare AGGIORNA.");
        return;
    }

    // rotazione dipendenti: sposta il primo in fondo
    const primo = dipendenti.shift();
    dipendenti.push(primo);

    // qui potresti applicare automaticamente le regole annuali
    // (per ora lasciamo solo la rotazione, le regole automatiche
    // possono essere aggiunte in un secondo step se vuoi vederle
    // una per una)

    initDipendenti();
    generaCalendario(annoCorrente);
    alert("Rotazione dipendenti applicata per l'anno " + annoCorrente);
});

// =========================
// POPUP BOTTONI
// =========================

document.getElementById("popup-conferma").addEventListener("click", assegnaFerie);
document.getElementById("popup-chiudi").addEventListener("click", chiudiPopup);

// =========================
// AVVIO
// =========================

initDipendenti();
generaCalendario(annoCorrente);
</script>

</body>
</html>
