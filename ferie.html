<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ferie - La Casereccia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial;
    background: #f4f5f7;
    margin: 0;
    padding: 20px;
    color: #333;
}

h2 {
    margin-bottom: 20px;
    color: #3a0ca3;
}

button {
    background: #3a0ca3;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 10px;
}

button:hover {
    background: #f72585;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 20px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #3a0ca3;
    color: white;
    padding: 8px;
}

td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
}

td.ferie {
    background: #ffb3b3;
    font-weight: bold;
    border-radius: 4px;
}

#calendari {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.mese-box {
    background: white;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #3a0ca3;
}

.mese-box h3 {
    text-align: center;
    margin-top: 0;
    color: #3a0ca3;
}

#popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px;
    border: 3px solid #3a0ca3;
    border-radius: 12px;
    display: none;
    z-index: 999;
    width: 300px;
}

#popup h3 {
    margin-top: 0;
    color: #3a0ca3;
}

input, select {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #aaa;
}
</style>
</head>

<body>

<h2>Gestione Ferie</h2>

Anno:
<select id="anno-select"></select>

<button id="modifica-btn">MODIFICA</button>
<button id="salva-btn">SALVA</button>

<h3>Dipendenti</h3>

<table id="dip-table">
<thead>
<tr>
    <th>Nome</th>
    <th>Ore iniziali</th>
    <th>Ore residue</th>
    <th>Elimina</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button id="add-dip">AGGIUNGI DIPENDENTE</button>

<br><br>

<div id="calendari"></div>

<!-- POPUP -->
<div id="popup">
    <h3>Assegna ferie</h3>
    <div id="popup-data"></div>

    <br>
    Dipendente:<br>
    <select id="popup-dip"></select>

    <br><br>
    Giorni di ferie:<br>
    <input id="popup-giorni" type="number" value="1" min="1" style="width:80px;">

    <br><br>
    <button id="popup-ok">OK</button>
    <button id="popup-del">ELIMINA</button>
    <button id="popup-close">CHIUDI</button>
</div>

<script>
// =========================
// STORAGE
// =========================

let dipendenti = JSON.parse(localStorage.getItem("dipendenti")) || [];
let ferie = JSON.parse(localStorage.getItem("ferie")) || {};

function salvaDip() { localStorage.setItem("dipendenti", JSON.stringify(dipendenti)); }
function salvaFerie() { localStorage.setItem("ferie", JSON.stringify(ferie)); }

// =========================
// ANNO
// =========================

const annoSel = document.getElementById("anno-select");
for (let a = 2024; a <= 2035; a++) {
    let opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    annoSel.appendChild(opt);
}
annoSel.value = new Date().getFullYear();

// =========================
// DIPENDENTI
// =========================

function renderDip() {
    const tbody = document.querySelector("#dip-table tbody");
    tbody.innerHTML = "";

    dipendenti.forEach((d, i) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td><input value="${d.nome}" data-i="${i}" class="nome"></td>
            <td><input value="${d.oreIniziali}" data-i="${i}" class="oreI"></td>
            <td><input value="${d.oreResidue}" data-i="${i}" class="oreR" disabled></td>
            <td><button data-i="${i}" class="delDip">X</button></td>
        `;

        tbody.appendChild(tr);
    });

    document.querySelectorAll(".nome").forEach(inp => {
        inp.oninput = () => {
            dipendenti[inp.dataset.i].nome = inp.value;
            salvaDip();
        };
    });

    document.querySelectorAll(".oreI").forEach(inp => {
        inp.oninput = () => {
            const i = inp.dataset.i;
            const nuove = parseInt(inp.value) || 0;
            dipendenti[i].oreIniziali = nuove;
            dipendenti[i].oreResidue = nuove;
            salvaDip();
            renderDip();
        };
    });

    document.querySelectorAll(".delDip").forEach(btn => {
        btn.onclick = () => {
            dipendenti.splice(btn.dataset.i, 1);
            salvaDip();
            renderDip();
        };
    });
}

document.getElementById("add-dip").onclick = () => {
    dipendenti.push({ nome:"Nuovo", oreIniziali:0, oreResidue:0 });
    salvaDip();
    renderDip();
};

// =========================
// CALENDARIO
// =========================

function generaCalendario() {
    const anno = parseInt(annoSel.value);
    const div = document.getElementById("calendari");
    div.innerHTML = "";

    for (let mese = 0; mese < 12; mese++) {
        const giorni = new Date(anno, mese+1, 0).getDate();

        let box = document.createElement("div");
        box.className = "mese-box";

        box.innerHTML = `<h3>${meseNome(mese)}</h3><table><tr>
            <th>Lu</th><th>Ma</th><th>Me</th><th>Gi</th><th>Ve</th><th>Sa</th><th>Do</th>
        </tr><tr>`;

        let firstDay = new Date(anno, mese, 1).getDay();
        if (firstDay === 0) firstDay = 7;

        for (let i = 1; i < firstDay; i++) box.innerHTML += "<td></td>";

        for (let g = 1; g <= giorni; g++) {
            box.innerHTML += `<td class="giorno" data-m="${mese}" data-g="${g}">${g}</td>`;
            if (new Date(anno, mese, g).getDay() === 0) box.innerHTML += "</tr><tr>";
        }

        box.innerHTML += "</tr></table>";
        div.appendChild(box);
    }

    document.querySelectorAll(".giorno").forEach(td => {
        td.onclick = () => apriPopup(td);
    });

    ricoloraFerie();
}

function meseNome(m) {
    return ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno",
            "Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"][m];
}

// =========================
// POPUP
// =========================

let giornoSelezionato = null;

function apriPopup(td) {
    giornoSelezionato = td;

    const anno = parseInt(annoSel.value);
    const mese = td.dataset.m;
    const giorno = td.dataset.g;

    document.getElementById("popup-data").textContent =
        `${giorno} ${meseNome(mese)} ${anno}`;

    const sel = document.getElementById("popup-dip");
    sel.innerHTML = "";
    dipendenti.forEach((d,i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = d.nome;
        sel.appendChild(opt);
    });

    document.getElementById("popup-giorni").value = 1;

    document.getElementById("popup").style.display = "block";
}

document.getElementById("popup-close").onclick = () => {
    document.getElementById("popup").style.display = "none";
};

// ASSEGNA FERIE
document.getElementById("popup-ok").onclick = () => {
    const anno = parseInt(annoSel.value);
    let mese = parseInt(giornoSelezionato.dataset.m);
    let giorno = parseInt(giornoSelezionato.dataset.g);

    const dipIndex = parseInt(document.getElementById("popup-dip").value);
    const giorniFerie = parseInt(document.getElementById("popup-giorni").value) || 1;

    if (!ferie[anno]) ferie[anno] = {};

    for (let i = 0; i < giorniFerie; i++) {
        const giorniNelMese = new Date(anno, mese+1, 0).getDate();

        if (!ferie[anno][mese]) ferie[anno][mese] = {};
        ferie[anno][mese][giorno] = dipendenti[dipIndex].nome;

        giorno++;
        if (giorno > giorniNelMese) {
            giorno = 1;
            mese++;
            if (mese > 11) break;
        }
    }

    dipendenti[dipIndex].oreResidue -= (8 * giorniFerie);
    if (dipendenti[dipIndex].oreResidue < 0) dipendenti[dipIndex].oreResidue = 0;

    salvaDip();
    salvaFerie();
    renderDip();
    generaCalendario();

    document.getElementById("popup").style.display = "none";
};

// ELIMINA FERIE
document.getElementById("popup-del").onclick = () => {
    const anno = parseInt(annoSel.value);
    const mese = giornoSelezionato.dataset.m;
    const giorno = giornoSelezionato.dataset.g;

    if (ferie[anno] && ferie[anno][mese] && ferie[anno][mese][giorno]) {

        const nomeDip = ferie[anno][mese][giorno];
        const dipIndex = dipendenti.findIndex(d => d.nome === nomeDip);

        if (dipIndex !== -1) {
            dipendenti[dipIndex].oreResidue += 8;
        }

        delete ferie[anno][mese][giorno];

        salvaDip();
        salvaFerie();
        renderDip();
        generaCalendario();

        alert("Ferie eliminate e ore residue aggiornate.");
    }

    document.getElementById("popup").style.display = "none";
};

// =========================
// COLORA FERIE
// =========================

function ricoloraFerie() {
    const anno = parseInt(annoSel.value);
    if (!ferie[anno]) return;

    document.querySelectorAll(".giorno").forEach(td => {
        const m = td.dataset.m;
        const g = td.dataset.g;

        if (ferie[anno][m] && ferie[anno][m][g]) {
            td.classList.add("ferie");
            td.textContent = `${g} (${ferie[anno][m][g]})`;
        }
    });
}

// =========================
// INIT
// =========================

renderDip();
generaCalendario();

</script>

</body>
</html>
